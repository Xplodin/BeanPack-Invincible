# Configuration file

general {
    # Use this to enable multi-part download [default: true]
    B:"Enable Multi-part Download"=true

    # Args for Java 21 jvm [default: ]
    S:"JVM Arguments"=

    # Path to javaw.exe or java binary [default: ]
    S:"Java Path"=

    # Library path, you may point it to launcher's library path for re-using, empty for default relauncher/ [default: ]
    S:"Library Path"=

    # Proxy address [default: ]
    S:"Proxy Address"=

    # Proxy Port [range: 0 ~ 65535, default: 0]
    I:"Proxy Port"=0

    # Put library files under directory of their group name [default: false]
    B:"Respect Library Structure"=false

    # Search for relauncher/Cleanroom-MMC-instance-*.zip and install from there [default: false]
    B:"Use Local MMC Pack"=false
}


